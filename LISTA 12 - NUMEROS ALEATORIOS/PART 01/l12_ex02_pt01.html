<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="sortear()">Sortear time</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function sortear() {
        var aleatorio = Math.random();
        var mensagem = '';
        var sorteio = aleatorio * 4 + 1;
        var corinthians = `<img src="https://upload.wikimedia.org/wikipedia/pt/thumb/b/b4/Corinthians_simbolo.png/250px-Corinthians_simbolo.png" width="150px">`;
        var saoPaulo = `<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Brasao_do_Sao_Paulo_Futebol_Clube.svg/250px-Brasao_do_Sao_Paulo_Futebol_Clube.svg.png" width="150px">`;
        var palmeiras = `<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Palmeiras_logo.svg/1200px-Palmeiras_logo.svg.png" width="150px">`;
        var cruzeiro = `<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Cruzeiro_Esporte_Clube_%28logo%29.svg/2048px-Cruzeiro_Esporte_Clube_%28logo%29.svg.png" width="150px">`;

            if(sorteio.toFixed(0) == 1){
                div_mensagem.innerHTML = `${sorteio} <br>`;
                mensagem = corinthians;
            } else if (sorteio.toFixed(0) == 2) {
                div_mensagem.innerHTML = `${sorteio} <br>`;
                mensagem = saoPaulo;
            } else if (sorteio.toFixed(0) == 3) {
                div_mensagem.innerHTML = `${sorteio} <br>`;
                mensagem = palmeiras;
            } else {
                div_mensagem.innerHTML = `${sorteio} <br>`;
                mensagem = cruzeiro;
            }

        div_mensagem.innerHTML += mensagem;
    }
</script>
